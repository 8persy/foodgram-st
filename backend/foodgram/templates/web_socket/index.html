<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Чат с именами</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .system-message {
      color: #6c757d;
      font-style: italic;
    }
    .user-message {
      color: rgba(255, 165, 0, 0.63);
    }
    .message-container {
      word-break: break-word;
    }
    .body {
      background-color: rgba(255, 165, 0, 0.08);
    }
  </style>
</head>
<body class="body">

<div class="modal fade" id="Modal" tabindex="-1" aria-hidden="false" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Введите ваше имя</h5>
      </div>
      <div class="modal-body">
        <input type="text" id="userNameInput" class="form-control" placeholder="Ваше имя">
      </div>
      <div class="modal-footer">
        <button id="confirmNameBtn" class="btn btn-primary">Подтвердить</button>
      </div>
    </div>
  </div>
</div>

<div class="container py-5">
  <h1 class="text-center mb-4">Чат</h1>
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-light">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span id="currentUserName" class="system-message"></span>
        </div>
        <div class="card-body d-flex flex-column" style="height: 500px;">
          <div id="chatMessages" class="flex-grow-1 overflow-auto mb-3 p-3 bg rounded"></div>
          <div class="input-group">
            <input id="chatInput" type="text" class="form-control" placeholder="Введите сообщение" disabled>
            <button class="btn btn-light" onclick="sendChat()" disabled id="sendBtn">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentUserName = "Аноним";
  const chatSocket = new WebSocket('ws://' + window.location.host + '/web_socket/chat/');
  const Modal = new bootstrap.Modal(document.getElementById('Modal'));

  // Показываем модальное окно при загрузке
  window.onload = function() {
    Modal.show();
  };

  // Обработчик подтверждения имени
  document.getElementById('confirmNameBtn').onclick = function() {
    const nameInput = document.getElementById('userNameInput');
    if (nameInput.value.trim()) {
      currentUserName = nameInput.value.trim();
      document.getElementById('currentUserName').textContent = currentUserName;

      // Отправляем имя на сервер
      chatSocket.send(JSON.stringify({
        set_name: currentUserName
      }));

      // Активируем чат
      document.getElementById('chatInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('chatInput').focus();

      Modal.hide();
    }
  };

  // Отправка по Enter в поле имени
  document.getElementById('userNameInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('confirmNameBtn').click();
    }
  });

  // Обработчик сообщений от сервера
  chatSocket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    const chatDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message-container mb-2';

    if (data.is_system) {
      messageDiv.innerHTML = `<span class="system-message">${data.message}</span>`;
    } else {
      messageDiv.innerHTML = `
        <strong class="user-message">${data.user_name}:</strong>
        <span> ${data.message}</span>
      `;
    }

    chatDiv.appendChild(messageDiv);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  };

  // Функция отправки сообщения
  function sendChat() {
    const input = document.getElementById('chatInput');
    if (input.value.trim()) {
      chatSocket.send(JSON.stringify({
        message: input.value.trim()
      }));
      input.value = '';
    }
    input.focus();
  }

  // Отправка по Enter в поле сообщения
  document.getElementById('chatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      sendChat();
    }
  });
</script>
</body>
</html>
